name: Handbook

# Every pull request is checked and built; a push to main also deploys the
# book to GitHub Pages, at https://innova-physics-upv.github.io/handbook/.
#
# Every action is pinned to the commit of a release (its version in the
# comment), so a moved tag cannot change what runs; Dependabot
# (.github/dependabot.yml) proposes the updates. mdBook is a downloaded
# binary, checked against its SHA-256 before it runs: to update it, change
# MDBOOK_VERSION and MDBOOK_SHA256 together (the digest of the
# x86_64-unknown-linux-musl archive on mdBook's release page).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the build only reads the repository. Only the deploy job
# may write to Pages, and only it gets an identity token.
permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_SHA256: "5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          curl -sSfL -o mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${MDBOOK_SHA256}  mdbook.tar.gz" | sha256sum --check --strict -
          mkdir -p "$HOME/bin"
          tar -xzf mdbook.tar.gz -C "$HOME/bin"
          rm mdbook.tar.gz
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Style check
        run: ./scripts/check-style.sh

      - name: Build
        run: mdbook build

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time: a newer one waits rather than cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
